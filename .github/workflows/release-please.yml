on:
  push:
    branches:
      - main
name: release-please
jobs:
  release-please-release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple
          token: ${{ secrets.INTEGRATIONS_MD_BOT_TOKEN }}
          skip-github-pull-request: true
  release-please-pr:
    runs-on: ubuntu-latest
    needs:
      - release-please-release
    steps:
      - id: release-pr
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.INTEGRATIONS_MD_BOT_TOKEN }}
          release-type: simple
          skip-github-release: true
